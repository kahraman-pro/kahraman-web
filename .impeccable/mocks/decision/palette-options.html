<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>kahraman.pro: renk ve font önerileri</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,600..900&family=Onest:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#888;font-family:Arial,sans-serif}
.opt{width:1440px;margin:0 auto 40px;background:var(--bg);color:var(--ink);font-family:var(--f);position:relative;overflow:hidden}
.tag{background:#111;color:#fff;padding:12px 40px;font:600 15px Arial;display:flex;justify-content:space-between}
.top{margin:14px auto 0;width:1240px;height:56px;display:flex;align-items:center;gap:22px;padding:0 22px;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);border-radius:16px;background:color-mix(in srgb,var(--paper) 85%,transparent);font-size:14px}
.top b{margin-right:auto;font-weight:700;letter-spacing:-.02em;font-size:16px}.top span{color:color-mix(in srgb,var(--ink) 65%,transparent)}
.btn{background:var(--ink);color:var(--paper);height:36px;padding:0 14px;display:inline-flex;align-items:center;border-radius:10px;font-size:13.5px;font-weight:600}
.hero{text-align:center;padding:96px 0 0}
h1{font-size:88px;line-height:1.02;letter-spacing:-.04em;font-weight:var(--hw);max-width:15ch;margin:0 auto}
.lede{font-size:21px;line-height:1.55;max-width:56ch;margin:28px auto 0;color:color-mix(in srgb,var(--ink) 72%,transparent)}
.cta{display:inline-flex;margin-top:34px;height:52px;padding:0 24px;align-items:center;background:var(--ink);color:var(--paper);border-radius:12px;font-size:16px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);width:1040px;margin:64px auto 0;background:var(--paper);border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);border-radius:20px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 12px 32px -16px rgb(0 0 0/.14);text-align:left}
.stats div{padding:22px 24px;border-right:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}.stats div:last-child{border:0}
.stats strong{display:block;font-size:38px;letter-spacing:-.04em;font-weight:var(--hw)}.stats em{font-style:normal;font-size:13px;color:color-mix(in srgb,var(--ink) 62%,transparent)}
.rows{width:1240px;margin:88px auto 0;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.rows div{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:26px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.rows h3{font-size:20px;letter-spacing:-.02em;font-weight:var(--hw)}.rows p{font-size:15.5px;color:color-mix(in srgb,var(--ink) 65%,transparent)}
.rows div.hov{background:var(--soft);margin:0 -14px;padding:26px 14px;border-radius:16px;border-color:transparent}
.rows a{color:var(--accent);font-weight:600}
.band{width:1240px;margin:70px auto 0;background:var(--band);border-radius:28px;padding:96px 40px;text-align:center}
.band h2{font-size:60px;letter-spacing:-.035em;line-height:1.04;max-width:14ch;margin:0 auto;font-weight:var(--hw)}
.band p{font-size:20px;max-width:46ch;margin:22px auto 0;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.band .btn2{display:inline-flex;margin-top:32px;height:52px;padding:0 24px;align-items:center;background:var(--ink);color:var(--paper);border-radius:12px;font-weight:600}
.band .btn2:hover,.cta:hover{background:var(--accent)}
.sw{display:flex;gap:0;width:1240px;margin:60px auto 40px;height:64px;border-radius:14px;overflow:hidden;font:600 12px Arial}
.sw div{flex:1;display:flex;align-items:flex-end;padding:8px 10px}
.t1{--bg:#f6f6f2;--paper:#ffffff;--band:#ee5a2a;--soft:#fde3d8;--ink:#14110f;--accent:#1f5f8b;--f:"Archivo",sans-serif;--hw:800}
.t2{--bg:#f2f4f1;--paper:#fbfcfa;--band:#c8d9ea;--soft:#e2ebf4;--ink:#14213d;--accent:#7a1f2e;--f:"Onest",sans-serif;--hw:700}
.t3{--bg:#f5f5f1;--paper:#ffffff;--band:#d4ee5c;--soft:#ebf6b4;--ink:#101418;--accent:#33470c;--f:"Bricolage Grotesque",sans-serif;--hw:700}
</style></head><body>
<script>
const opts=[
 {c:'t1',n:'A · Fuar turuncusu + Archivo',d:'Sıcak beyaz zemin, mandalina band, deniz mavisi vurgu. Archivo: sert, afiş gibi, tok başlıklar.',sw:[['#f6f6f2','bg'],['#ffffff','paper'],['#ee5a2a','band'],['#fde3d8','soft'],['#14110f','ink'],['#1f5f8b','accent']]},
 {c:'t2',n:'B · Defter mavisi + Onest',d:'Soğuk gri-yeşil kâğıt, defter mavisi band, lacivert mürekkep, bordo vurgu. Onest: sakin, güven veren, geniş.',sw:[['#f2f4f1','bg'],['#fbfcfa','paper'],['#c8d9ea','band'],['#e2ebf4','soft'],['#14213d','ink'],['#7a1f2e','accent']]},
 {c:'t3',n:'C · Misket limonu + Bricolage Grotesque',d:'Nötr zemin, limon band, neredeyse siyah mürekkep, zeytin vurgu. Bricolage: karakterli, ele yapılmış hissi.',sw:[['#f5f5f1','bg'],['#ffffff','paper'],['#d4ee5c','band'],['#ebf6b4','soft'],['#101418','ink'],['#33470c','accent']]}];
document.body.innerHTML=opts.map(o=>`<section class="opt ${o.c}"><div class="tag"><span>${o.n}</span><span style="font-weight:400">${o.d}</span></div>
<div class="top"><b>Mustafa Kahraman</b><span>Services</span><span>My work</span><span>Blog</span><span>Results</span><span>Process</span><span>About</span><span>Contact</span><i class="btn">Get in touch</i></div>
<div class="hero"><h1>Software and AI, built for how your team works.</h1><p class="lede">I look at how your business runs, show where software and AI save the most time and where they do not, then build it myself.</p><span class="cta">Send me a short message</span>
<div class="stats"><div><strong>3M</strong><em>Monthly visits across the sites</em></div><div><strong>50K+</strong><em>Products synced to sales channels</em></div><div><strong>1M+</strong><em>Members on one platform</em></div><div><strong>$20K+</strong><em>Average daily sales on one store</em></div></div></div>
<div class="rows"><div class="hov"><h3>Custom software, designed and built end to end.</h3><p>Web apps, internal tools, backends, APIs and mobile apps, built properly and handed over with notes. <a>Read more</a></p></div><div><h3>AI agents and AI features that work with your own data.</h3><p>Assistants that answer from your data, helpers that sort records, reports written by AI.</p></div><div><h3>Integrations and automation that keep your systems in sync.</h3><p>Store, CRM, email, marketplaces and payments connected so data moves on its own.</p></div></div>
<div class="band"><h2>Have work that should take less time?</h2><p>Send a short message with your project, your tools and your goal.</p><span class="btn2">Send me a short message</span></div>
<div class="sw">${o.sw.map(([h,l])=>`<div style="background:${h};color:${['#14110f','#14213d','#101418','#7a1f2e','#33470c','#1f5f8b','#ee5a2a'].includes(h)?'#fff':'#000'}">${l} ${h}</div>`).join('')}</div></section>`).join('');
</script></body></html>
